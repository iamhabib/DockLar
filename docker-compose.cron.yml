services:
  cron:
    image: ${COMPOSE_PROJECT_NAME}-php:latest
    container_name: ${ENV}_${APP_NAME}_cron
    restart: unless-stopped
    working_dir: /var/www
    mem_limit: ${CRON_CONTAINER_MEMORY:-256m}
    volumes:
      - ../:/var/www:delegated
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini.template:ro
    environment:
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512M}
      PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-30M}
      PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-30M}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-60}
    networks:
      mynet: {}
    # flock -n skips a tick if the previous schedule:run is still running
    command: ["sh", "-c", "while :; do flock -n /tmp/laravel-scheduler.lock php /var/www/artisan schedule:run; sleep 60; done"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mynet:
    driver: bridge
    name: ${ENV}_${APP_NAME}_network
