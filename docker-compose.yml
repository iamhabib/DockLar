services:
  php:
    image: ${COMPOSE_PROJECT_NAME}-php:latest
    build:
      context: ./
      dockerfile: ./Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
        ENABLE_MONGODB_EXTENSION: ${ENABLE_MONGODB_EXTENSION:-false}
        ENABLE_MONGODB_EXTENSION_VERSION: ${ENABLE_MONGODB_EXTENSION_VERSION:-1.20.0}
        ENABLE_SQLITE_EXTENSION: ${ENABLE_SQLITE_EXTENSION:-false}
        NPM: ${NPM:-false}
        NODE_VERSION: ${NODE_VERSION:-20}
    container_name: ${ENV}_${APP_NAME}_php
    restart: unless-stopped
    working_dir: /var/www
    mem_limit: ${PHP_CONTAINER_MEMORY:-1g}
    volumes:
      - ../:/var/www:delegated
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini.template:ro
      - ./php/www-custom.conf:/usr/local/etc/php-fpm.d/www.conf:ro
    environment:
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512M}
      PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-30M}
      PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-30M}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-60}
    networks:
      mynet: {}
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: ${ENV}_${APP_NAME}_nginx
    restart: unless-stopped
    mem_limit: ${NGINX_CONTAINER_MEMORY:-128m}
    ports:
      - "127.0.0.1:${CONTAINER_PORT}:80"
    depends_on:
      - php
    environment:
      NGINX_ENVSUBST_FILTER: "^PHP_UPLOAD_MAX_FILESIZE$"
      PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-30M}
    volumes:
      - ../:/var/www:delegated
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    networks:
      mynet: {}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mynet:
    driver: bridge
    name: ${ENV}_${APP_NAME}_network
