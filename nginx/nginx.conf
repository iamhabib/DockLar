server {
    listen          80;

    error_log       /var/log/nginx/error.log;
    access_log      /var/log/nginx/access.log;

    root            /var/www/public;
    index           index.php;

    client_max_body_size ${PHP_UPLOAD_MAX_FILESIZE};

    # Exact health endpoint for container healthchecks (no PHP)
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /storage/ {
        alias /var/www/public/storage/;
        try_files $uri $uri/ =404;
    }

    # Deny PHP under /storage/ (must be before the general \.php$ location)
    location ~* ^/storage/.*\.php$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny hidden files and directories
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny common secret / backup extensions
    location ~* \.(git|env|config|htaccess|htpasswd|ini|log|sh|inc|bak|sql)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        set $fastcgi_https "";
        if ($http_x_forwarded_proto = "https") {
            set $fastcgi_https "on";
        }
        fastcgi_param HTTPS $fastcgi_https;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
